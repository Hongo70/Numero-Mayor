<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Numeros Mayores</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background-color: #f7f8fa; 
    }
    input { 
      padding: 5px; 
      margin: 5px 0; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      width: 150px; 
    }
    button { 
      padding: 6px 12px; 
      border: none; 
      background-color: #0078D7; 
      color: white; 
      border-radius: 4px; 
      cursor: pointer; 
    }
    button:hover { 
      background-color: #005fa3; 
    }
    #recuadro {
      margin-top: 20px;
      padding: 15px;
      background-color: #e9f5ff;
      border: 2px solid #0078D7;
      border-radius: 8px;
      width: fit-content;
      font-size: 16px;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: none;
    }
  </style>
</head>
<body>
  <h2>Ingrese 3 números para encontrar el mayor</h2>

  <input type="number" id="num1" placeholder="Número 1">
  <br>
  <input type="number" id="num2" placeholder="Número 2">
  <br>
  <input type="number" id="num3" placeholder="Número 3">
  <br>
  <button id="enviar">Enviar</button>

  <div id="recuadro"></div>

  <script>
    document.getElementById("enviar").addEventListener("click", () => {
      const n1 = document.getElementById("num1").value;
      const n2 = document.getElementById("num2").value;
      const n3 = document.getElementById("num3").value;
      const recuadro = document.getElementById("recuadro");

      if (n1 === "" || n2 === "" || n3 === "") {
        recuadro.style.display = "block";
        recuadro.textContent = "Por favor, ingrese los tres números.";
        return;
      }

      fetch("/api/json", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          cajaNum1: n1,
          cajaNum2: n2,
          cajaNum3: n3
        })
      })
      .then(res => res.json())
      .then(mayor => {
        recuadro.style.display = "block";
        recuadro.textContent = mayor.mensaje;
      })
      .catch(err => {
        recuadro.style.display = "block";
        recuadro.textContent = "Error: " + err;
      });
    });
  </script>
</body>
</html>
